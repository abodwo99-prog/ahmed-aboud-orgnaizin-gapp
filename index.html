<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14304a"><title>Soft Services RFP&#39;s Editable Bulk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2314304a%22/><text x=%2250%22 y=%2273%22 font-size=%2262%22 text-anchor=%22middle%22 fill=%22%23d6a24a%22>S</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#edf0ee;--cd:#fff;--tx:#16222e;--mu:#66737f;--bd:#d9dfdc;--ink:#14304a;--ac:#1f5c8a;--br:#b07d2b;--ok:#1e7a62;--bad:#b4412f}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0d141b;--cd:#15202b;--tx:#e6ecf1;--mu:#8d9ba8;--bd:#243342;--ink:#1b4468;--ac:#5b9bd0;--br:#d6a24a;--ok:#4fc3a1;--bad:#f08a78}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
#app{max-width:680px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 26px/1.3 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;margin:4px 0}h1::after{content:"";display:block;width:38px;height:3px;background:var(--br);margin-top:6px;border-radius:2px}
h2{font-size:16px;font-weight:600;margin:0 0 10px}.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--bd);margin:12px 0 16px}
nav button{flex:none;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--mu);padding:9px 13px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{color:var(--tx);border-bottom-color:var(--br);font-weight:600}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
input,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g label.full{grid-column:1/-1}
.b{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:500;cursor:pointer}
.b.x{background:transparent;color:var(--bad);padding:6px 8px}.b.w{width:100%;margin-top:14px;min-height:48px}.b:disabled{opacity:.6}
.ck{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}.ck input{width:auto;margin-top:5px}
.er{color:var(--bad);font-size:14px;margin:10px 0 0}.ok{color:var(--ok);font-size:14px;margin:10px 0 0}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.lw{max-width:380px;margin:60px auto 0}.lw input{height:48px}
.sec{font-weight:600;margin:18px 0 2px;color:var(--ac)}
</style></head><body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const SV=[{id:'hk',n:'Housekeeping',tpl:'templates/housekeeping.docx'},{id:'fc',n:'الواجهات'},{id:'pc',n:'مكافحة الحشرات'},{id:'af',n:'ماكينات المعطر'},{id:'wr',n:'رفع المخلفات'},{id:'sa',n:'مشغل Serviced Apartment'}];
const MP=[['MP1','مدير مشروع'],['MP2','مشرف عام'],['MP3','مشرف ميداني'],['MP4','عمال أولاد'],['MP5','عمال بنات'],['MP6','إداري موقع']];
const REVIEW=['جدول Table 1 (Included / Excluded): راجع كل بند لأنه منقول من مشروع تاني (مجتمع، حمام سباحة، مساجد، Caretaker...)',
'جدول Table 2 والـ Cleaning Period: التكرارات المناسبة للمشروع',
'ساعات التشغيل: فيه تعارض داخل الملف (7:30-5:30 / 8-5 / 8:30 ص - 9 م وكتوب 9 ساعات / 8-8 وكتوب 12 ساعة) وحّدها حسب المشروع',
'بنود الـ Tram وعربيات الجولف والـ Plant pots في Basic Scope: امسح اللي مش موجود في الموقع',
'Section D: كميات المعدات (QTY فاضية) وماركات الخامات',
'القوائم في الفقرة الأولى (Common areas, Towers, Plaza\u2019s...): سيب اللي ينطبق بس',
'اسم المشروع Zed West والمراحل في الغلاف: عدّلهم لو المشروع اتغير',
'عدد سنين العقد وسنة الـ Steady State',
'سن العمالة/المشرفين (المشرف لحد 30 والعامل 20-30): قرر تفضل ولا لأ',
'إشارة Clause 17 في جدول الـ KPI: اتأكد إنها بتشاور على بند فعلي في العقد',
'لوجو CPM (OPM) في هيدر الملف: سيبه أو شيله حسب قرارك'];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='hk',msg='',D={};
const ld=()=>{try{return JSON.parse(localStorage.getItem('rfp1')||'{}')}catch(x){return{}}};D=ld();
function save(){try{localStorage.setItem('rfp1',JSON.stringify(D))}catch(x){}}
const g=k=>(D[tab]=D[tab]||{})[k]??'';
function fld(k,l,ph,cls){return '<label class="'+(cls||'')+'">'+l+'<input data-k="'+k+'" value="'+e(g(k))+'" placeholder="'+(ph||'')+'"></label>'}
function R(){document.body.style.background='';let h='<h1>Soft Services RFP\'s Editable Bulk</h1><div class="mu">مولّد ملفات RFP قابلة للتعديل</div><nav>'+
SV.map(s=>'<button class="'+(tab==s.id?'on':'')+'" onclick="tab=\''+s.id+'\';msg=\'\';R()">'+e(s.n)+'</button>').join('')+'</nav>';
const s=SV.find(x=>x.id==tab);
if(!s.tpl){h+='<div class="cd"><h2>'+e(s.n)+'</h2><p class="mu">القسم ده جاهز في النظام وبانتظار ملف الـ RFP الخاص بيه وقائمة التعديلات اليدوية.</p></div>'}
else{h+='<div class="cd"><h2>بيانات الـ Tender (تتغير يدويًا كل مرة)</h2><div class="g">'+
fld('COVER_DATE','تاريخ الغلاف (السنة)','1st of JAN 2027')+fld('CONTRACT_YEARS','مدة العقد (سنين)','3')+fld('STEADY_YEAR','سنة الـ Steady State','2028')+fld('KPI_THRESHOLD','حد الأداء المقبول %','95')+'</div>'+
'<label>خريطة المراحل (صفحة 3)<input id="img" type="file" accept="image/*"></label>'+
'<div class="sec">جدول Manpower (تحت Staffing Requirements)</div><div class="g">'+MP.map(m=>fld(m[0],m[1],'العدد')).join('')+'</div>'+
'<label class="full">Basic Scope: ALL phase 1 scope (سطر لكل بند)<textarea data-k="BASIC_SCOPE" placeholder="ALL phase 1 scope: public areas, common area, gates...">'+e(g('BASIC_SCOPE'))+'</textarea></label>'+
'<label class="full">Optional Scope (Phase Two) (سيبه فاضي لو مفيش خطط مستقبلية)<textarea data-k="OPTIONAL_SCOPE" placeholder="ALL phase 2 scope: ...">'+e(g('OPTIONAL_SCOPE'))+'</textarea></label>'+
'<button class="b w" id="go" onclick="gen()">تنزيل ملف الـ RFP</button>'+(msg?'<div class="'+(msg[0]=='✓'?'ok':'er')+'">'+e(msg)+'</div>':'')+'</div>'+
'<div class="cd"><h2>بنود تراجعها يدويًا في كل Tender</h2><div class="mu">المنظومة مش بتغيرها، لازم تعدلها بنفسك قبل الإرسال.</div>'+
REVIEW.map((t,i)=>'<label class="ck"><input type="checkbox" data-c="'+i+'" '+(g('ck'+i)?'checked':'')+'><span>'+e(t)+'</span></label>').join('')+'</div>'}
document.getElementById('app').innerHTML=h}
document.addEventListener('input',ev=>{const t=ev.target,k=t.dataset&&t.dataset.k;if(k){(D[tab]=D[tab]||{})[k]=t.value;save()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.c!=null){(D[tab]=D[tab]||{})['ck'+t.dataset.c]=t.checked;save()}});
const x2=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function toJpeg(f){const u=URL.createObjectURL(f),im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});
const W=2116,H=1046,c=document.createElement('canvas');c.width=W;c.height=H;const q=c.getContext('2d');q.fillStyle='#fff';q.fillRect(0,0,W,H);
const k=Math.min(W/im.width,H/im.height),w=im.width*k,h=im.height*k;q.drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(u);
return new Promise(r=>c.toBlob(r,'image/jpeg',.9))}
async function gen(){const b=document.getElementById('go'),d=D[tab]||{};msg='';
for(const k of['COVER_DATE','CONTRACT_YEARS','BASIC_SCOPE'])if(!(d[k]||'').trim()){msg='املأ: تاريخ الغلاف، مدة العقد، و Basic Scope';return R()}
b.disabled=true;b.textContent='جاري التجهيز...';
try{const s=SV.find(x=>x.id==tab),z=await JSZip.loadAsync(await(await fetch(s.tpl)).arrayBuffer());
let x=await z.file('word/document.xml').async('string');
const rp=(t,v)=>{x=x.split('{{'+t+'}}').join(x2(v))};
rp('COVER_DATE',d.COVER_DATE.trim());rp('CONTRACT_YEARS',d.CONTRACT_YEARS.trim());rp('STEADY_YEAR',(d.STEADY_YEAR||'').trim());rp('KPI_THRESHOLD',(d.KPI_THRESHOLD||'95').trim());
let tot=0;MP.forEach(m=>{const v=(d[m[0]]||'').trim();tot+=parseFloat(v)||0;rp(m[0],v||'-')});rp('MPT',tot||'-');
const lines=t=>(d[t]||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
for(const t of['BASIC_SCOPE','OPTIONAL_SCOPE']){const tk='{{'+t+'}}',i=x.indexOf(tk);if(i<0)continue;
const a=x.lastIndexOf('<w:p ',i),c=x.indexOf('</w:p>',i)+6,p=x.slice(a,c),L=lines(t);
x=x.slice(0,a)+L.map(l=>p.replace(tk,x2(l))).join('')+x.slice(c)}
x=x.split('<w:highlight w:val="yellow"/>').join('');
z.file('word/document.xml',x);
const im=document.getElementById('img');if(im&&im.files[0])z.file('word/media/image1.jpeg',await toJpeg(im.files[0]));
const bl=await z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),
a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=s.n+'-RFP-'+d.COVER_DATE.replace(/[^\w]+/g,'_')+'.docx';a.click();msg='✓ تم تنزيل الملف'}
catch(err){msg='حصل خطأ: '+err.message}
R()}
R();
</script></body></html>
