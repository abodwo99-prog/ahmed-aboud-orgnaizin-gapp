<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#edf0ee;--cd:#fff;--tx:#16222e;--mu:#66737f;--bd:#d9dfdc;--ink:#14304a;--ac:#1f5c8a;--br:#b07d2b;--ok:#1e7a62;--bad:#b4412f;--wn:#9a6a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d141b;--cd:#15202b;--tx:#e6ecf1;--mu:#8d9ba8;--bd:#243342;--ink:#1b4468;--ac:#5b9bd0;--br:#d6a24a;--ok:#4fc3a1;--bad:#f08a78;--wn:#e2b04a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d141b;--cd:#15202b;--tx:#e6ecf1;--mu:#8d9ba8;--bd:#243342;--ink:#1b4468;--ac:#5b9bd0;--br:#d6a24a;--ok:#4fc3a1;--bad:#f08a78;--wn:#e2b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:680px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 27px/1.3 "Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;margin:4px 0 2px}
h1::after{content:"";display:block;width:38px;height:3px;background:var(--br);margin-top:6px;border-radius:2px}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
.sub{color:var(--mu);font-size:13px;margin:8px 0 14px}
nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--bd);margin-bottom:16px}
nav button{flex:none;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--mu);padding:9px 13px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{color:var(--tx);border-bottom-color:var(--br);font-weight:600}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:22px 20px 18px;margin-bottom:8px}
.hl{font-size:13px;opacity:.75}
.hn{font:700 46px/1.2 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;margin:2px 0 14px}.hn small{font:500 15px "IBM Plex Sans Arabic",sans-serif;opacity:.7}
.hn.neg{color:#ffb4a6}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.14);gap:2px}
.stack i{display:block;height:100%}
.a{background:#7fa6c9}.b{background:#d6a24a}.c{background:#e9eef2}.d{background:#5fd1ae}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0;font-size:13px}
.lg u{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;text-decoration:none}
.dl{border-top:1px solid rgba(255,255,255,.18);padding-top:12px;font-size:15px}.dl b{font-size:18px}
.cd{padding:18px 0;border-top:1px solid var(--bd);margin:0}
.cd.box,#pv .cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px}
.ln{display:flex;align-items:baseline;gap:8px;padding:3px 0}.ln i{flex:1;border-bottom:1px dotted var(--bd);transform:translateY(-4px)}.ln.tt{font-weight:600}
.ln b.tt{color:var(--ac)}
.cat{padding:9px 0}.ch{display:flex;justify-content:space-between;gap:8px}.cp{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px;margin-top:5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:8px 11px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--br);outline-offset:1px}
input.f{flex:1 1 100px}input.s{width:84px}
.b{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:8px 15px;font:inherit;font-weight:500;cursor:pointer}
.b.x{background:transparent;color:var(--bad);padding:6px 8px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ac)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.wn{color:var(--wn)}.mu{color:var(--mu);font-size:13px}
.al{background:color-mix(in srgb,var(--wn) 14%,var(--cd));border-inline-start:4px solid var(--wn);border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:14px}
.done{text-decoration:line-through;color:var(--mu)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.frm .full{grid-column:1/-1}.frm input,.frm select{width:100%}
.it.col{display:block}.it.col .ch{align-items:baseline}.act{display:flex;gap:6px;margin-top:8px}.act input{flex:1}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tools{display:flex;gap:6px;flex:none;margin-top:6px}
.tools button{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
select{max-width:100%}
body.lgn{background:var(--ink)}body.lgn #app{max-width:none;padding:0}
.lw{min-height:100dvh;display:flex;flex-direction:column;background:var(--ink)}
.lh{padding:54px 28px 58px;color:#fff;text-align:center;background:radial-gradient(circle at 12% 10%,rgba(214,162,74,.28),transparent 42%),repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 1px,transparent 1px 16px)}
.lh h1{color:#fff;font-size:31px;margin:16px 0 4px}.lh h1::after{margin:10px auto 0}
.lh p{margin:10px 0 0;opacity:.78;font-size:14px}
.mk{width:70px;height:70px;margin:0 auto;border:2px solid var(--br);border-radius:22px;display:grid;place-items:center;font:700 40px/1 "Reem Kufi",sans-serif;color:var(--br)}
.lc{flex:1;background:var(--bg);border-radius:28px 28px 0 0;margin-top:-28px;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px))}
.lc form{max-width:380px;margin:0 auto}
.lc h2{font-size:20px;margin:0 0 4px}.lc .sb{color:var(--mu);font-size:14px;margin:0 0 18px}
.lc label{display:block;font-size:13px;font-weight:500;margin:12px 0 5px}
.lc input{width:100%;height:50px;font-size:16px}
.pw{position:relative}.pw input{padding-right:78px;padding-left:14px}
.pw button{position:absolute;right:6px;left:auto;top:7px;height:36px;border:0;background:transparent;color:var(--ac);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0 10px}
.lc .go{width:100%;height:52px;margin-top:20px;font-size:16px;font-weight:600}
.lc .go:disabled{opacity:.7}
.er{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,var(--cd));color:var(--bad);font-size:14px}
@media(min-width:700px){.lw{justify-content:center}.lh{padding-bottom:70px}.lc{flex:none;width:430px;max-width:92%;margin:-30px auto 0;border-radius:24px;border:1px solid var(--bd)}}
@media(max-width:640px){
#app{padding:14px 14px 100px}
h1{font-size:23px}.hn{font-size:40px}
.hero{padding:18px 16px 14px;border-radius:18px}
nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--cd);border-top:1px solid var(--bd);border-bottom:0;margin:0;padding:0 4px env(safe-area-inset-bottom,0px);justify-content:space-around;overflow:visible}
nav button{flex:1;padding:13px 2px 11px;font-size:13px;border-bottom:0;border-top:3px solid transparent}
nav button.on{border-top-color:var(--br)}
.row>input.f{flex:1 1 40%}
.b{min-height:42px}.b.x{min-height:36px}
.it{flex-wrap:wrap}
}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const D={salary:42000,fixed:[],paid:{},exp:[],extra:[],debts:[],dp:[],debtPct:30,method:'sn',
cats:[{n:'أكل وشرب',p:35},{n:'مواصلات',p:15},{n:'ترفيه وشخصي',p:15},{n:'ادخار وطوارئ',p:25},{n:'متفرقات',p:10}],todos:[]};
let S=(()=>{try{return Object.assign({},D,JSON.parse(localStorage.getItem('mz1')||'{}'))}catch(x){return D}})();
let tab='sum';
const SB_URL='https://aoutyafrchecgpafsdnf.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvdXR5YWZyY2hlY2dwYWZzZG5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTMzNDEsImV4cCI6MjEwNzkyOTM0MX0.b6DwnZxaJCNf87Xk40_tjCd8xqcRmHMK_ElP9Q58B9Q';
window.onerror=m=>{document.getElementById('app').innerHTML='<div class="cd"><h2>حصل خطأ</h2><p class="bad">'+m+'</p></div>'};
let sb=null,U=null,tm,cfgErr='';
try{sb=supabase.createClient(SB_URL.trim(),SB_KEY.trim())}catch(x){cfgErr=x.message}
const save=()=>{try{localStorage.setItem('mz1',JSON.stringify(S))}catch(x){}push()};
function push(){if(!U)return;clearTimeout(tm);tm=setTimeout(async()=>{const r=await sb.from('budget').upsert({user_id:U.id,data:S,updated_at:new Date().toISOString()});if(r.error)console.error(r.error)},600)}
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let hid=false;const f=n=>hid?'••••':Math.round(n).toLocaleString('en-US');
const v=id=>document.getElementById(id).value, nm=id=>parseFloat(v(id))||0;
const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const sum=a=>a.reduce((s,x)=>s+x,0);
const id=()=>Date.now()+Math.random();
function cyc(){const t=new Date();let y=t.getFullYear(),m=t.getMonth();if(t.getDate()<25){m--;if(m<0){m=11;y--}}
const s=new Date(y,m,25),en=new Date(y,m+1,25),td=new Date(t.getFullYear(),t.getMonth(),t.getDate());
return{y,m,s,e:en,key:y+'-'+(m+1),td,left:Math.max(1,Math.round((en-td)/864e5))}}
const inC=(d,c)=>{const x=new Date(d+'T00:00');return x>=c.s&&x<c.e};
function up(fn){fn();save();R()}
function calc(){const c=cyc(),ex=S.extra.filter(x=>inC(x.date,c)),extra=sum(ex.map(x=>x.a)),income=S.salary+extra,
fixed=sum(S.fixed.map(x=>x.a)),af=income-fixed,open=S.debts.some(d=>d.b>0),
allot=open?Math.max(0,af)*S.debtPct/100:0,rest=af-allot,xs=S.exp.filter(x=>inC(x.date,c)),spent=sum(xs.map(x=>x.a)),
dpaid=sum(S.dp.filter(x=>inC(x.date,c)).map(x=>x.a));
return{c,ex,extra,income,fixed,af,allot,rest,xs,spent,remain:rest-spent,daily:(rest-spent)/c.left,dpaid}}
function due(x,c){const dt=x.d>=25?new Date(c.y,c.m,x.d):new Date(c.y,c.m+1,x.d);return{dt,days:Math.round((dt-c.td)/864e5)}}
function plan(allot){let ds=S.debts.filter(d=>d.b>0).map(d=>({...d}));
ds.sort(S.method=='av'?(a,b)=>(b.i||0)-(a.i||0):(a,b)=>a.b-b.b);
let pool=allot;const now=ds.map(d=>{const p=Math.min(pool,d.b);pool-=p;return{...d,pay:p}});
const out={};let m=0;
if(allot>0)while(ds.some(d=>d.b>0)&&m<600){m++;let p=allot;ds.forEach(d=>{if(d.b>0)d.b+=d.b*(d.i||0)/1200});
for(const d of ds){if(d.b<=0)continue;const q=Math.min(p,d.b);d.b-=q;p-=q;if(d.b<=0.5&&!out[d.id])out[d.id]=m}}
return{now,out,m}}
const fmtM=m=>m==null?'أكثر من 50 سنة':m>=12?Math.floor(m/12)+' سنة و '+(m%12)+' شهر':m+' شهر';
const ar=d=>d.toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'long'});
function R(){document.body.classList.remove('lgn');const k=calc(),c=k.c;
const tabs=[['todo','المهام'],['sum','الملخص'],['fix','الثوابت'],['debt','الديون'],['exp','المصروفات']];
let h='<div class="hd"><h1>مكتب احمد عبود</h1><div class="tools"><button onclick="tog()">'+(hid?'🔒 إظهار':S.pinHash?'🙈 إخفاء':'🔐 تعيين كود')+'</button><button onclick="logout()">خروج</button></div></div><div class="sub">دورة الشهر: من '+ar(c.s)+' إلى '+ar(c.e)+' (باقي '+c.left+' يوم)</div><nav>'+
tabs.map(t=>'<button class="'+(tab==t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';R()">'+t[1]+'</button>').join('')+'</nav>';
const paid=S.paid[c.key]||[];
const soon=S.fixed.filter(x=>!paid.includes(x.id)&&due(x,c).days<=3);
if(soon.length&&tab!='fix')h+='<div class="al"><b>تفكير بالمدفوعات:</b> '+soon.map(x=>{const d=due(x,c).days;return e(x.n)+' ('+f(x.a)+') '+(d<0?'متأخر '+(-d)+' يوم':d==0?'النهاردة':'بعد '+d+' يوم')}).join(' · ')+'</div>';
h+=({sum:vSum,fix:vFix,exp:vExp,debt:vDebt,todo:vTodo})[tab](k);
document.getElementById('app').innerHTML=h}
function vSum(k){const c=k.c,inc=Math.max(k.income,1);
const seg=(x,cl)=>'<i class="'+cl+'" style="width:'+Math.max(0,Math.min(100,x/inc*100))+'%"></i>';
let h='<section class="hero"><div class="hl">المتبقي من ميزانية الشهر</div><div class="hn '+(k.remain<0?'neg':'')+'">'+f(k.remain)+' <small>جنيه</small></div><div class="stack">'+seg(k.fixed,'a')+seg(k.allot,'b')+seg(Math.min(k.spent,Math.max(0,k.rest)),'c')+seg(Math.max(0,k.remain),'d')+'</div>'+
'<div class="lg"><span><u class="a"></u>ثوابت '+f(k.fixed)+'</span><span><u class="b"></u>ديون '+f(k.allot)+'</span><span><u class="c"></u>مصروف '+f(k.spent)+'</span><span><u class="d"></u>باقي '+f(Math.max(0,k.remain))+'</span></div>'+
'<div class="dl">'+(k.remain<0?'تخطيت الميزانية بـ <b>'+f(-k.remain)+'</b> جنيه':'تقدر تصرف <b>'+f(Math.max(0,k.daily))+' جنيه</b> في اليوم لمدة '+c.left+' يوم')+'</div></section>';
if(k.af<0)h+='<p class="bad">البنود الثابتة أكتر من الدخل بـ '+f(-k.af)+' جنيه. راجع البنود.</p>';
const L=(a,b,cl)=>'<div class="ln'+(cl?' tt':'')+'"><span>'+a+'</span><i></i><b class="'+(cl||'')+'">'+b+'</b></div>';
h+='<section class="cd"><h2>حساب الشهر</h2>'+L('الراتب',f(S.salary))+(k.extra?L('دخل إضافي','+'+f(k.extra)):'')+L('بنود ثابتة','−'+f(k.fixed))+(k.allot?L('سداد ديون','−'+f(k.allot)):'')+L('المتاح للمصروفات',f(k.rest),'tt')+'</section>';
h+='<section class="cd"><h2>الحدود حسب الفئة</h2>';
const tot=sum(S.cats.map(x=>x.p));
S.cats.forEach((x,i)=>{const lim=k.rest*x.p/100,sp=sum(k.xs.filter(y=>y.c==x.n).map(y=>y.a)),pc=lim>0?Math.min(100,sp/lim*100):0;
h+='<div class="cat"><div class="ch"><span>'+e(x.n)+'</span><span class="'+(sp>lim?'bad':'')+'">'+f(sp)+' من '+f(lim)+'</span></div><div class="bar"><i style="width:'+pc+'%;background:'+(sp>lim?'var(--bad)':'var(--ac)')+'"></i></div><div class="cp"><input class="s" type="number" value="'+x.p+'" onchange="up(()=>S.cats['+i+'].p=+this.value||0)">% <span>باقي '+f(lim-sp)+'</span></div></div>'});
h+='<div class="mu">مجموع النسب: '+tot+'%'+(tot!=100?' <span class="bad">(لازم يبقى 100%)</span>':'')+'</div></section>';
h+='<section class="cd"><h2>الراتب والدخل الإضافي</h2><div class="row">الراتب الشهري (يتضاف يوم 25): '+(hid?'<b>••••</b>':'<input class="s" type="number" value="'+S.salary+'" onchange="up(()=>S.salary=+this.value||0)" style="width:100px">')+'</div>'+(!hid&&S.pinHash?'<div class="row"><button class="b" onclick="pinUI(\'cur\')">تغيير الكود</button><button class="b x" onclick="pinUI(\'rm\')">إلغاء الكود</button></div>':'')+
'<div class="frm"><input id="ea" type="number" inputmode="decimal" placeholder="مبلغ إضافي (بونص...)"><input id="en" placeholder="ملاحظة (اختياري)"><button class="b full" onclick="addExtra()">إضافة الدخل</button></div>';
k.ex.forEach(x=>{h+='<div class="it"><span>+'+f(x.a)+' · '+e(x.n||'دخل إضافي')+' <span class="mu">'+x.date+'</span></span><button class="b x" onclick="up(()=>S.extra=S.extra.filter(y=>y.id!='+x.id+'))">حذف</button></div>'});
return h+'</section>'}
function addExtra(){const a=nm('ea');if(a>0)up(()=>S.extra.push({id:id(),a,n:v('en'),date:iso(new Date())}))}
function vFix(k){const c=k.c,paid=S.paid[c.key]||[];
let h='<div class="cd"><h2>البنود الثابتة الشهرية</h2><div class="mu">بتتكرر كل شهر وهفكرك قبل ميعادها بـ 3 أيام.</div><div class="frm"><input id="fn" class="full" placeholder="اسم البند (إيجار، نت...)"><input id="fa" type="number" inputmode="decimal" placeholder="المبلغ"><input id="fd" type="number" inputmode="numeric" min="1" max="31" placeholder="يوم الاستحقاق"><button class="b full" onclick="addFix()">إضافة البند</button></div>';
if(!S.fixed.length)h+='<p class="mu">لسه مفيش بنود. أضف إيجار، كهرباء، موبايل، اشتراكات، أقساط...</p>';
S.fixed.forEach(x=>{const d=due(x,c),p=paid.includes(x.id);
h+='<div class="it"><span class="'+(p?'done':'')+'">'+e(x.n)+' · '+f(x.a)+' <span class="mu">(يوم '+x.d+' · '+(p?'مدفوع':d.days<0?'<b class=bad>متأخر</b>':d.days<=3?'<b class=wn>بعد '+d.days+' يوم</b>':'بعد '+d.days+' يوم')+')</span></span><span><button class="b" onclick="togPaid('+x.id+')">'+(p?'تراجع':'دفعت')+'</button><button class="b x" onclick="up(()=>S.fixed=S.fixed.filter(y=>y.id!='+x.id+'))">حذف</button></span></div>'});
return h+'<p>إجمالي الثوابت: <b>'+f(k.fixed)+'</b> جنيه</p></div>'}
function addFix(){const a=nm('fa'),d=Math.min(31,Math.max(1,nm('fd')|0||1));if(v('fn')&&a>0)up(()=>S.fixed.push({id:id(),n:v('fn'),a,d}))}
function togPaid(i){up(()=>{const k=cyc().key,p=S.paid[k]=S.paid[k]||[];const j=p.indexOf(i);j<0?p.push(i):p.splice(j,1)})}
function vExp(k){let h='<div class="cd"><h2>سجّل مصروف</h2><div class="frm"><select id="xc" class="full">'+S.cats.map(x=>'<option>'+e(x.n)+'</option>').join('')+'</select><input id="xa" type="number" inputmode="decimal" placeholder="المبلغ"><input id="xn" placeholder="ملاحظة (اختياري)"><button class="b full" onclick="addExp()">إضافة المصروف</button></div>'+
'<p class="mu">المتبقي النهاردة: '+f(k.remain)+' · الحد اليومي '+f(Math.max(0,k.daily))+'</p></div><div class="cd"><h2>مصروفات الدورة</h2>';
if(!k.xs.length)h+='<p class="mu">لسه مفيش مصروفات.</p>';
k.xs.slice().reverse().forEach(x=>{h+='<div class="it"><span>'+f(x.a)+' · '+e(x.c)+(x.n?' · '+e(x.n):'')+' <span class="mu">'+x.date+'</span></span><button class="b x" onclick="up(()=>S.exp=S.exp.filter(y=>y.id!='+x.id+'))">حذف</button></div>'});
return h+'</div>'}
function addExp(){const a=nm('xa');if(a>0)up(()=>S.exp.push({id:id(),a,c:v('xc'),n:v('xn'),date:iso(new Date())}))}
function vDebt(k){const p=plan(k.allot),tot=sum(S.debts.map(d=>Math.max(0,d.b)));
let h='<div class="cd"><h2>ديوني</h2><div class="frm"><input id="dn" class="full" placeholder="اسم الدين"><input id="db" type="number" inputmode="decimal" placeholder="المبلغ المتبقي"><input id="di" type="number" inputmode="decimal" placeholder="فايدة سنوية % (اختياري)"><button class="b full" onclick="addDebt()">إضافة الدين</button></div>';
if(!S.debts.length)h+='<p class="mu">لو ملكش ديون سيبها فاضية وكل المتاح هيتوزع على الفئات.</p>';
S.debts.forEach(d=>{h+='<div class="it col"><div class="ch"><b>'+e(d.n)+'</b><span>باقي <b>'+f(Math.max(0,d.b))+'</b>'+(d.i?' <span class="mu">(فايدة '+d.i+'%)</span>':'')+(d.b<=0?' <b class="ok">اتسدد ✓</b>':'')+'</span></div><div class="act"><input id="p'+String(d.id).replace('.','')+'" type="number" inputmode="decimal" placeholder="مبلغ السداد"><button class="b" onclick="payDebt('+d.id+')">سداد</button><button class="b x" onclick="up(()=>S.debts=S.debts.filter(y=>y.id!='+d.id+'))">حذف</button></div></div>'});
h+='<p>إجمالي الديون: <b>'+f(tot)+'</b> جنيه</p></div>';
if(tot>0){h+='<div class="cd"><h2>خطة السداد</h2><div class="row">نسبة السداد من المتبقي بعد الثوابت: <input class="s" type="number" value="'+S.debtPct+'" onchange="up(()=>S.debtPct=Math.min(100,+this.value||0))">%</div><div class="row">طريقة السداد: <select style="width:100%" onchange="up(()=>S.method=this.value)"><option value="sn"'+(S.method=='sn'?' selected':'')+'>الأصغر الأول (أسرع إحساس بالإنجاز)</option><option value="av"'+(S.method=='av'?' selected':'')+'>الأعلى فايدة الأول (أوفر)</option></select></div>'+
'<p>المخصص للسداد الشهر ده: <b>'+f(k.allot)+'</b> جنيه (اتسدد '+f(k.dpaid)+')</p>';
if(k.allot<=0)h+='<p class="bad">مفيش متبقي بعد الثوابت للسداد.</p>';
else{h+='<div class="mu">ترتيب السداد والدفع المقترح الشهر ده:</div>';
p.now.forEach((d,i)=>{h+='<div class="it"><span>'+(i+1)+'. '+e(d.n)+' → ادفع <b>'+f(d.pay)+'</b></span><span class="mu">يخلص بعد '+fmtM(p.out[d.id])+'</span></div>'});
h+='<p>تخلص كل الديون تقريبًا بعد: <b>'+fmtM(p.m>=600?null:p.m)+'</b></p>'}
h+='</div>'}
return h}
function addDebt(){const b=nm('db');if(v('dn')&&b>0)up(()=>S.debts.push({id:id(),n:v('dn'),b,i:nm('di')}))}
function payDebt(i){const a=nm('p'+String(i).replace('.',''));if(a>0)up(()=>{const d=S.debts.find(x=>x.id==i);d.b=Math.max(0,d.b-a);S.dp.push({a,date:iso(new Date())})})}
function vTodo(){let h='<div class="cd"><h2>قائمة المهام</h2><div class="row"><input id="tn" class="f" placeholder="أي حاجة عايزها (اشتري، ادفع، اسأل...)"><button class="b" onclick="addTodo()">إضافة</button></div>';
if(!S.todos.length)h+='<p class="mu">القائمة فاضية.</p>';
S.todos.forEach(t=>{h+='<div class="it"><label class="'+(t.d?'done':'')+'"><input type="checkbox" '+(t.d?'checked':'')+' onchange="up(()=>S.todos.find(y=>y.id=='+t.id+').d=this.checked)"> '+e(t.n)+'</label><button class="b x" onclick="up(()=>S.todos=S.todos.filter(y=>y.id!='+t.id+'))">حذف</button></div>'});
return h+'</div>'}
function addTodo(){if(v('tn'))up(()=>S.todos.push({id:id(),n:v('tn'),d:false}))}
function login(m,em){document.body.classList.add('lgn');let sv='';try{sv=em||localStorage.getItem('mz_em')||''}catch(x){}
document.getElementById('app').innerHTML='<div class="lw"><div class="lh"><div class="mk">ع</div><h1>مكتب احمد عبود</h1></div><div class="lc"><form onsubmit="auth(event)"><h2>أهلاً بيك</h2><p class="sb">سجّل دخولك عشان تكمل.</p>'+
'<label for="em">الإيميل</label><input id="em" type="email" inputmode="email" autocomplete="username" dir="ltr" value="'+e(sv)+'" required>'+
'<label for="pw">كلمة السر</label><div class="pw"><input id="pw" type="password" autocomplete="current-password" dir="ltr" required><button type="button" onclick="const p=document.getElementById(\'pw\');p.type=p.type==\'password\'?\'text\':\'password\';this.textContent=p.type==\'password\'?\'إظهار\':\'إخفاء\'">إظهار</button></div>'+
(m?'<div class="er">'+e(m)+'</div>':'')+'<button id="lb" class="b go" type="submit">دخول</button></form></div></div>'}
async function auth(ev){ev.preventDefault();const b=document.getElementById('lb');b.disabled=true;b.textContent='جاري الدخول...';const em=v('em').trim();
let r;try{r=await sb.auth.signInWithPassword({email:em,password:v('pw')})}catch(x){return login('مفيش اتصال بالإنترنت. جرّب تاني.',em)}
if(r.error)return login(/invalid login/i.test(r.error.message)?'الإيميل أو كلمة السر غلط. جرّب تاني.':'تعذر الدخول: '+r.error.message,em);
try{localStorage.setItem('mz_em',em)}catch(x){}boot()}
async function logout(){await sb.auth.signOut();U=null;login()}
async function boot(){if(!sb)return document.getElementById('app').innerHTML='<div class="cd"><h2>إعداد Supabase ناقص</h2><p class="bad">'+e(cfgErr)+'</p><p>راجع سطر SB_URL و SB_KEY في أول الكود: لازم المفتاح الكامل يتحط بدل eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvdXR5YWZyY2hlY2dwYWZzZG5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNTMzNDEsImV4cCI6MjEwNzkyOTM0MX0.b6DwnZxaJCNf87Xk40_tjCd8xqcRmHMK_ElP9Q58B9Q.</p></div>';
const g=await sb.auth.getSession();if(!g.data.session)return login();U=g.data.session.user;
const r=await sb.from('budget').select('data').eq('user_id',U.id).maybeSingle();
if(r.data&&r.data.data){S=Object.assign({},D,r.data.data);try{localStorage.setItem('mz1',JSON.stringify(S))}catch(x){}}else push();hid=!!S.pinHash;R()}
const hs=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mz:'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function tog(){if(hid)pinUI('unlock');else if(S.pinHash){hid=true;R()}else pinUI('set')}
function pinX(){const o=document.getElementById('pv');if(o)o.remove()}
function pinUI(mode,msg){let o=document.getElementById('pv');if(!o){o=document.createElement('div');o.id='pv';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px';document.body.appendChild(o)}
const t={unlock:'اكتب الكود لإظهار الأرقام',set:'اختر كود أرقام (4 إلى 8)',cur:'اكتب الكود الحالي لتغييره',rm:'اكتب الكود الحالي لإلغائه'}[mode];
o.innerHTML='<div class="cd" style="width:100%;max-width:320px;margin:0"><h2>'+t+'</h2><div class="row"><input id="pn" class="f" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" style="text-align:center;font-size:20px;letter-spacing:6px" onkeydown="if(event.key==\'Enter\')pinOk(\''+mode+'\')"></div><p class="bad">'+e(msg||'')+'</p><div class="row"><button class="b" onclick="pinOk(\''+mode+'\')">تأكيد</button><button class="b x" onclick="pinX()">إلغاء</button></div></div>';
document.getElementById('pn').focus()}
async function pinOk(mode){const p=v('pn');if(!/^\d{4,8}$/.test(p))return pinUI(mode,'الكود لازم يكون من 4 إلى 8 أرقام');
if(mode=='set'){S.pinHash=await hs(p);hid=false;save();pinX();return R()}
if(await hs(p)!==S.pinHash)return pinUI(mode,'الكود غلط');
if(mode=='unlock'){hid=false;pinX();R()}
else if(mode=='cur')pinUI('set')
else if(mode=='rm'){delete S.pinHash;hid=false;save();pinX();R()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&U&&S.pinHash){hid=true;R()}});
boot();
</script></body></html>
