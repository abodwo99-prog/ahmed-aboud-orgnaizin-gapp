<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8ecf0;--cd:#fff;--tx:#16222e;--mu:#617080;--bd:#d5dce3;--ink:#14304a;--ac:#1f5c8a;--br:#b07d2b;--ok:#1e7a62;--bad:#b4412f;--pp:#fff;--ppt:#1b2733;--hl:#fff3c4}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0c131a;--cd:#14202b;--tx:#e6ecf1;--mu:#8d9ba8;--bd:#243342;--ink:#0f2a42;--ac:#5b9bd0;--br:#d6a24a;--ok:#4fc3a1;--bad:#f08a78;--pp:#f4f6f8;--ppt:#1b2733;--hl:#5a4a14}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 "IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
header{background:var(--ink);color:#fff;padding:20px 20px 18px}
.in{max-width:1080px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px}
.mk{width:46px;height:46px;border:2px solid var(--br);border-radius:14px;display:grid;place-items:center;font:700 24px/1 "Reem Kufi",sans-serif;color:var(--br);flex:none}
h1{font:700 24px/1.25 "Reem Kufi","IBM Plex Sans Arabic",sans-serif;margin:0;direction:ltr;text-align:right}
.sb{font-size:13px;opacity:.72}
.crumb{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}
.crumb button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:9px;padding:6px 12px;font:inherit;cursor:pointer}
.crumb span{opacity:.8}
main{max-width:1080px;margin:0 auto;padding:22px 16px 110px}
.home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.win{background:var(--cd);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.wh{background:var(--ink);color:#fff;padding:22px 20px;border-bottom:3px solid var(--br)}

.wh span{font-size:13px;opacity:.75}
.wb{padding:12px;display:grid;gap:8px}
.sv{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:11px;padding:13px 14px;font:inherit;font-weight:500;cursor:pointer;text-align:start;width:100%;transition:border-color .15s,transform .1s}
.sv:hover{border-color:var(--br)}.sv:active{transform:scale(.99)}.sv[disabled]{opacity:.55;cursor:default}
.sv small{color:var(--mu);font-weight:400;font-size:12px;white-space:nowrap}
.sv .dot{color:var(--ok)}
.sep{font-size:12px;color:var(--mu);margin:6px 4px 0;font-weight:600}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
.fm{display:grid;gap:16px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:20px}
h2{font-size:16px;font-weight:600;margin:0}.hs{display:block;color:var(--mu);font-size:13px;margin:2px 0 14px}
label{display:block;font-size:13px;font-weight:500;margin:0 0 5px}
input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;width:100%;min-width:0;transition:border-color .15s,background .15s}
input:focus,textarea:focus{background:var(--cd);border-color:var(--ac);outline:0}textarea{min-height:110px;resize:vertical}
button:focus-visible,summary:focus-visible,.dz:focus-within{outline:2px solid var(--br);outline-offset:2px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rq{color:var(--bad);font-weight:400;margin-inline-start:4px}
.dz{position:relative;display:flex;align-items:center;gap:14px;border:1.5px dashed var(--bd);border-radius:12px;padding:12px;background:var(--bg);cursor:pointer}
.dz input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.th{width:104px;height:64px;border-radius:7px;background:var(--bd) center/cover no-repeat;flex:none}
.mp{display:grid;border:1px solid var(--bd);border-radius:11px;overflow:hidden}
.mr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 8px 7px 14px;border-top:1px solid var(--bd)}.mr:first-child{border-top:0}
.mr input{width:84px;text-align:center;font-weight:600}.mr.t{background:var(--bg);font-weight:600;padding:12px 14px}
details summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}summary::-webkit-details-marker{display:none}
.pg{font-size:13px;color:var(--mu);white-space:nowrap}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--bd);font-size:14px;font-weight:400;margin:0}.ck input{width:18px;height:18px;margin-top:4px;flex:none;accent-color:var(--ok)}
.ck:has(input:checked) span{color:var(--mu);text-decoration:line-through}
aside{position:sticky;top:14px}
.ph{font-size:13px;color:var(--mu);margin:0 4px 8px;display:flex;justify-content:space-between}
.pp{background:var(--pp);color:var(--ppt);border-radius:6px;padding:26px 24px;box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 30px rgba(10,30,50,.16);direction:ltr;font:13px/1.5 "Palatino Linotype",Palatino,Georgia,serif}
.pp .lg{display:flex;justify-content:space-between;font:11px "IBM Plex Sans Arabic",sans-serif;color:#7a8794;border-bottom:1px solid #d8dde2;padding-bottom:8px;margin-bottom:22px}
.pp .t1{font-size:21px;font-weight:700;color:#1f497d;text-align:center}.pp .t2{text-align:center;font-weight:700;margin-top:3px}.pp .t3{text-align:center;color:#1f497d;font-weight:700;margin:2px 0}
.pp .dt{text-align:center;font-weight:700;color:#1f497d;margin:18px 0 20px}
.pp hr{border:0;border-top:1px solid #d8dde2;margin:14px 0}
.pp b.k{font-weight:600}.pp table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}.pp td{border:1px solid #b9c1c9;padding:3px 7px}.pp td:last-child{text-align:center;width:70px;font-weight:700}.pp tr.t td{background:#eef1f4;font-weight:700}
.pp .sc{margin:6px 0 0;padding-inline-start:18px;font-size:12px}.pp em{font-style:normal;background:var(--hl);padding:0 4px;border-radius:2px}
.bar{position:fixed;inset:auto 0 0 0;background:var(--cd);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{display:flex;align-items:center;gap:16px;justify-content:space-between}
.bt{font-size:13px;color:var(--mu)}.bt b{color:var(--tx)}
.b{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 26px;font:inherit;font-weight:600;cursor:pointer;min-height:46px;transition:transform .1s}.b:active{transform:scale(.98)}.b:disabled{opacity:.6}
.er{color:var(--bad)!important}.ok{color:var(--ok)!important}
@media(max-width:900px){.home{grid-template-columns:1fr}.ed{grid-template-columns:1fr}aside{position:static;order:2}.bt{display:none}.b{width:100%}h1{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const LB={hk:'Housekeeping',pc:'Pest Control',fc:'Facade Cleaning',wm:'Waste Management',sd:'Scent Diffusers'};
const PJ=[{n:'Zed East',loc:'New Cairo',sv:['ze-hk','ze-pc','ze-wm','-','zc-hk','zc-pc','zc-wm']},
{n:'Zed West',loc:'Zayed City',sv:['zw-hk','zw-pc','zw-fc','zw-wm','zw-sd','sa']},
{n:'Silversands',loc:'North Coast',sv:['sv-hk','sv-pc','sv-wm']}];
const TT={hk:'Housekeeping (Outdoor, Indoor) Services',pc:'Pest Control Services',wm:'Waste Management Services',fc:'Façade cleaning Services (External Cleaning)',sd:'Scent Diffusers Services'};
const LC={'Zed West':'Zayed City','Zed East':'New Cairo','Silversands':'North Coast','Zed East Club':'New Cairo'};
const MP=[['MP1','مدير مشروع','Project Manager'],['MP2','مشرف عام','General Supervisor'],['MP3','مشرف ميداني','Field Supervisor'],['MP4','عمال أولاد','Workers (Male)'],['MP5','عمال بنات','Workers (Female)'],['MP6','إداري موقع','Site Administrator']];
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=i=>document.getElementById(i);
let V=null,msg='',D={},IMG=null;
try{D=JSON.parse(localStorage.getItem('rfp2')||'{}')}catch(x){}
const save=()=>{try{localStorage.setItem('rfp2',JSON.stringify(D))}catch(x){}};
const g=k=>{const d=D[V]=D[V]||{};return d[k]!==undefined?d[k]:(k=='COVER_EXTRA'?(M[V].cover_extra||[]).join('\n'):k=='KPI_THRESHOLD'?'95':'')};
const lines=t=>String(g(t)).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
const total=()=>MP.reduce((a,m)=>a+(parseFloat(g(m[0]))||0),0);
const nm=id=>{const m=M[id];return (m.proj=='Zed East Club'?'Club — ':'')+LB[m.svc]};
function need(){const m=M[V],n=[];if(!String(g('COVER_DATE')).trim())n.push('تاريخ الغلاف');if(m.years&&!String(g('CONTRACT_YEARS')).trim())n.push('مدة العقد');if(m.basic&&!lines('BASIC_SCOPE').length)n.push('Basic Scope');return n}
function review(m){const r=['اسم المشروع والمراحل وسطور الغلاف: راجعها','القوائم في الفقرة الأولى (Common areas, Towers, Plaza…): سيب اللي ينطبق بس','ساعات التشغيل وجداول التكرار: راجعها حسب المشروع','لوجو CPM (OPM) في هيدر الملف: سيبه أو شيله حسب قرارك'];

if(m.svc=='pc')r.push('جداول المبيدات والزيارات: راجعها حسب المشروع');
return r}
function home(){V=null;msg='';$('cr').hidden=true;$('br').hidden=true;

const fl=(k,l,ph,r)=>'<div><label>'+l+(r?'<span class="rq">مطلوب</span>':'')+'</label><input data-k="'+k+'" value="'+e(g(k))+'" placeholder="'+ph+'" dir="ltr"></div>';
let h='<div class="ed"><div class="fm"><div class="cd"><h2>بيانات الـ Tender</h2><span class="hs">بتتغير يدويًا مع كل ملف جديد</span><div class="g">'+fl('COVER_DATE','تاريخ الغلاف (السنة)','1st of JAN 2027',1)+(m.years?fl('CONTRACT_YEARS','مدة العقد (سنين)','3',1):'')+(m.steady?fl('STEADY_YEAR','سنة الـ Steady State','2028'):'')+(m.kpi?fl('KPI_THRESHOLD','حد الأداء المقبول %','95'):'')+'</div>'+
'<label style="margin-top:14px">سطور الغلاف (Phase / نطاق الخدمة)، سطر لكل فقرة</label><textarea data-k="COVER_EXTRA" style="min-height:80px">'+e(g('COVER_EXTRA'))+'</textarea></div>';
if(m.img)h+='<div class="cd"><h2>خريطة المراحل</h2><span class="hs">بتظهر في القسم A مكان الـ Site Plan</span><label class="dz"><div class="th" id="th"></div><div><b>اضغط لاختيار صورة</b><div id="fn" style="color:var(--mu);font-size:13px;font-weight:400">لو ما اخترتش، هتفضل الخريطة الحالية في الـ Template</div></div><input id="img" type="file" accept="image/*"></label></div>';
if(m.mp)h+='<div class="cd"><h2>جدول Manpower</h2><span class="hs">تحت Staffing Requirements</span><div class="mp">'+MP.map(x=>'<div class="mr"><span>'+x[1]+'</span><input data-k="'+x[0]+'" type="number" min="0" inputmode="numeric" value="'+e(g(x[0]))+'" placeholder="0" dir="ltr"></div>').join('')+'<div class="mr t"><span>الإجمالي</span><span id="tt">-</span></div></div></div>';
if(m.basic)h+='<div class="cd"><h2>Basic Scope<span class="rq">مطلوب</span></h2><span class="hs">ALL phase 1 scope، اكتب كل بند في سطر</span><textarea data-k="BASIC_SCOPE" placeholder="Public areas&#10;Common areas&#10;Gates">'+e(g('BASIC_SCOPE'))+'</textarea></div>';
if(m.optional)h+='<div class="cd"><h2>Optional Scope (Phase Two)</h2><span class="hs">سيبه فاضي لو مفيش خطط مستقبلية</span><textarea data-k="OPTIONAL_SCOPE" placeholder="ALL phase 2 scope">'+e(g('OPTIONAL_SCOPE'))+'</textarea></div>';
const rv=review(m);
h+='<details class="cd"><summary><div><h2>تراجعها يدويًا قبل الإرسال</h2><span class="hs" style="margin:2px 0 0">النظام مش بيغيرها</span></div><span class="pg" id="cp"></span></summary>'+rv.map((t,i)=>'<label class="ck"><input type="checkbox" data-c="'+i+'" '+(g('ck'+i)?'checked':'')+'><span>'+e(t)+'</span></label>').join('')+'</details></div>'+
'<aside><div class="ph"><span>معاينة مباشرة</span><span>بتتحدث وأنت بتكتب</span></div><div class="pp" id="pv"></div></aside></div>';
$('mn').innerHTML=h;pv()}
function pv(){if(!V||!$('pv'))return;const m=M[V],ph=(v,p)=>v?e(v):'<em>'+p+'</em>',B=lines('BASIC_SCOPE'),O=lines('OPTIONAL_SCOPE'),X=lines('COVER_EXTRA');
let h='<div class="lg"><span>ORA PROPERTIES</span><span>Page 1</span></div><div class="t1">Ora – '+e(m.proj)+'</div><div class="t2">'+e(LC[m.proj])+', Egypt</div><div class="t2" style="margin-top:14px">Request For Proposal</div><div class="t3">'+e(TT[m.svc])+'</div><div class="t3" style="font-weight:400">Facilities Management Tender</div>'+X.map(l=>'<div class="t3" style="font-weight:400;font-size:12px">'+e(l)+'</div>').join('')+'<div class="dt">'+ph(g('COVER_DATE'),'تاريخ الغلاف')+'</div>';

if(m.mp)h+='<hr><b class="k">Required Manpower (Minimum)</b><table>'+MP.map(x=>'<tr><td>'+x[2]+'</td><td>'+(g(x[0])?e(g(x[0])):'-')+'</td></tr>').join('')+'<tr class="t"><td>Total</td><td>'+(total()||'-')+'</td></tr></table>';
if(m.basic)h+='<hr><b class="k">Basic Scope</b>'+(B.length?'<ul class="sc">'+B.map(l=>'<li>'+e(l)+'</li>').join('')+'</ul>':'<div><em>Basic Scope</em></div>');
